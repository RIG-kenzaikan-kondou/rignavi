<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RIGナビ</title>
<!--
  RIGナビの入口ページ(2026-11-06)。スマホ用の画面(GASのスマホ用の発行)をこのページに埋め込んで出す。
  ・Googleの「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」の帯は、埋め込むと出ない
  ・ホーム画面に追加した時のアイコン・名前もここで決まる(GASでは指定できない)
  使い方: このページのURL + ?k=合鍵(今の専用URLの ?k= から後ろと同じ)。&v=haisha(配車)/ &v=add(予定)もそのまま渡す。
  このページ自体には合鍵も何も入れない(URLで受け取ってそのまま渡すだけ)
-->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RIGナビ">
<meta name="theme-color" content="#ffffff">
<style>
  html, body { margin: 0; height: 100%; background: #f2f4f7; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { font-family: sans-serif; padding: 24px; line-height: 1.8; color: #1d2330; }
</style>
</head>
<body>
<script>
  // スマホ用の発行のURL(deploy.ps1 の mobileUrl。作り直した時だけ変える)
  var APP = 'https://script.google.com/macros/s/AKfycbwyIFSuXe6q8tYxQOqoAy1NdXgmWm9zl9HRA0e7Y3IGUTc43w3ToyYt2S9xn9y4nFCd/exec';
  var KEEP = ['k', 'v', 'check'];
  function pick(search) {
    var p = new URLSearchParams(search), q = new URLSearchParams();
    KEEP.forEach(function (n) { if (p.get(n)) q.set(n, p.get(n)); });
    return q;
  }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }   // アプリとしてインストールできるように
  var q = pick(location.search);
  if (!q.get('k') && !q.get('check')) {
    document.body.innerHTML = '<div class="msg"><h2>URLの最後が切れています</h2><p>「?k=」から後ろ(合鍵)がありません。近藤さんにURLをもう一度もらってください。</p></div>';
  } else {
    var f = document.createElement('iframe');
    f.allow = 'geolocation; clipboard-write';
    function open(qs) { var x = new URLSearchParams(qs); x.set('w', '1'); f.src = APP + '?' + x.toString(); }
    open(q);
    document.body.appendChild(f);
    // 画面の中のリンク(役員画面⇔配車⇔予定)は、ここで切り替える(そのまま飛ぶとGoogleの画面に戻って帯が出る)
    window.addEventListener('message', function (e) {
      var d = e.data; if (!d || d.rignavi !== 'go' || typeof d.url !== 'string' || d.url.indexOf(APP) !== 0) return;
      var nq = pick(d.url.slice(d.url.indexOf('?')));
      open(nq);
      try { history.replaceState(null, '', location.pathname + '?' + nq.toString()); } catch (x) { }
    });
  }
</script>
</body>
</html>
